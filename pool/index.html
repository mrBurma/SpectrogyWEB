  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

body{margin:0;padding:0}\nhtml{scroll-behavior:smooth}\n[id]{scroll-margin-top:72px}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n@media (max-width:760px){[data-problem-grid]{grid-template-columns:repeat(2,minmax(0,1fr))!important}}\n@media (max-width:440px){[data-problem-grid]{grid-template-columns:1fr!important}}\nbody{background:#ECF2F6;color:#0E2433;font-family:\"Source Serif 4\",Georgia,serif;font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased;text-wrap:pretty}\n*{box-sizing:border-box}\na{color:inherit;text-decoration:none}\na:hover{color:#1F7FA8}\n:focus-visible{outline:2px solid #1F7FA8;outline-offset:3px}\n<\/style>\n<\/helmet>\n\n<div style=\"background:#0B2233\">\n  <nav style=\"position:sticky;top:0;z-index:20;background:rgba(11,34,51,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1E4864\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:14px clamp(20px,5vw,64px);display:flex;align-items:center;gap:clamp(14px,2.6vw,32px);flex-wrap:wrap;font-family:Archivo,sans-serif;font-size:14px;color:#7C9FB8\">\n      <a href=\"#top\" style=\"color:#EAF3F9;font-weight:700;letter-spacing:.17em;font-size:13px;margin-right:auto\">SPECTROGY<\/a>\n      <a href=\"#problem\" style=\"font-weight:600\">Problem<\/a>\n      <a href=\"#measurement\" style=\"font-weight:600\">Measurement<\/a>\n      <a href=\"#system\" style=\"font-weight:600\">System<\/a>\n      <a href=\"#platform\" style=\"font-weight:600\">Platform<\/a>\n      <a href=\"#pricing\" style=\"font-weight:600\">Pricing<\/a>\n    <\/div>\n  <\/nav>\n\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"position:relative;overflow:hidden;max-width:1240px;margin:0 auto;padding:clamp(52px,7vw,88px) clamp(20px,5vw,64px) clamp(48px,6vw,72px);color:#EAF3F9\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(160deg,#14344A 0%,#0B2233 55%,#071827 100%)\"><\/div>\n    <div style=\"position:absolute;top:0;bottom:0;right:0;left:52%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 14%);mask-image:linear-gradient(90deg,transparent 0%,#000 14%)\"><image-slot id=\"pool-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"Drop a photo of a pool\" src=\"9a1798c5-34f0-4d97-b021-5b56cfc5b7ce\"><\/image-slot><\/div>\n    <div style=\"position:absolute;inset:0;background:linear-gradient(100deg,#0B2233 0%,rgba(11,34,51,.97) 62%,rgba(11,34,51,.62) 80%,rgba(11,34,51,.28) 100%);pointer-events:none\"><\/div>\n    <div style=\"position:relative;pointer-events:none\">\n    <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#63C7E8;margin:0 0 22px\">SPECTROGY FOR POOLS AND AQUATIC FACILITIES<\/p>\n    <h1 style=\"font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(38px,6.4vw,80px);line-height:.98;letter-spacing:-.032em;margin:0 0 28px;max-width:18ch\">Your chemistry reads perfect. Your water may still be carrying what the chemistry cannot see.<\/h1>\n    <p style=\"font-size:clamp(19px,2.1vw,24px);line-height:1.5;color:#D7E8F3;max-width:46ch;margin:0 0 clamp(34px,4.5vw,48px)\">Spectrogy is an inline optical sensor that watches the biology in your circulation loop, continuously, in seconds. It sits on the pipe next to your chemistry controller and tells you when something is growing in water that passes every chemical check.<\/p>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin:0 0 clamp(40px,5vw,60px)\">\n      <button type=\"button\" onclick=\"window.location.href='mailto:dm@spectrogy.com?subject=Technical%20walkthrough%20request%20-%20Pool%20Monitoring'\" style=\"pointer-events:auto;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;padding:14px 26px;background:#EAF3F9;color:#0E2433;border:1px solid #EAF3F9;cursor:pointer\">Book a technical walkthrough<\/button>\n    <\/div>\n\n    <div style=\"border-top:1px solid #1E4864;padding-top:18px;display:flex;flex-wrap:wrap;gap:10px 26px;font-family:Archivo,sans-serif;font-size:13.5px;font-weight:600;color:#7C9FB8\">\n      <span>Reagent free<\/span><span>Inline 24/7<\/span><span>No consumables<\/span><span>MODBUS TCP<\/span><span>BACnet/IP<\/span>\n    <\/div>\n  <\/div>\n  <\/section>\n<\/div>\n\n<section id=\"problem\" data-screen-label=\"The gap\" style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(20px,5vw,64px) clamp(40px,5vw,64px)\">\n  <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#5A7B90;margin:0 0 22px\">THE PROBLEM<\/p>\n  <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(29px,4vw,46px);line-height:1.06;letter-spacing:-.026em;margin:0 0 22px;max-width:22ch\">Chlorine and pH are proxies. Biology is the actual risk.<\/h2>\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px);margin:0 0 clamp(34px,4vw,52px)\">\n    <p style=\"flex:1 1 380px;font-size:18.5px;color:#4B6B80;margin:0;max-width:54ch\">Every commercial pool in the United States runs on the same measurement stack: free chlorine, pH, ORP, temperature, sometimes turbidity. That stack was designed to confirm that a disinfection process is running. It was never designed to see what is living in the water.<\/p>\n    <p style=\"flex:1 1 300px;font-size:18.5px;color:#0E2433;margin:0;max-width:40ch;font-weight:600\">The distance between those two things is where facilities get hurt.<\/p>\n  <\/div>\n\n  <div data-problem-grid=\"\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#C9DCE8;border:1px solid #C9DCE8\">\n    <div style=\"background:#F7FBFD;padding:clamp(20px,2vw,26px)\">\n      <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.014em\">Compliant water, sick swimmers<\/h3>\n      <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0 0 12px\">CDC counted 493 outbreaks tied to treated recreational water between 2000 and 2014, with at least 27,219 cases and eight deaths. Where the cause was confirmed, most were organisms that live in biofilm or tolerate chlorine at ordinary setpoints.<\/p>\n      <p style=\"font-family:Archivo,sans-serif;font-size:13px;line-height:1.5;color:#5A7B90;border-top:1px solid #C9DCE8;padding-top:10px;margin:0\"><a href=\"https://www.cdc.gov/mmwr/volumes/67/wr/mm6719a3.htm\" style=\"text-decoration:underline;text-underline-offset:2px\">CDC, MMWR 67(19), 18 May 2018 \u2014 Outbreaks Associated with Treated Recreational Water, United States, 2000\u20132014<\/a><\/p>\n    <\/div>\n    <div style=\"background:#F7FBFD;padding:clamp(20px,2vw,26px)\">\n      <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.014em\">Biofilm lives past disinfection<\/h3>\n      <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0\">Biofilm forms on pipe walls, filter media, gutters, surge tanks and jets. Inside that matrix, organisms survive chlorine far above your setpoint. The bulk water reads clean while the surfaces keep seeding it.<\/p>\n    <\/div>\n    <div style=\"background:#F7FBFD;padding:clamp(20px,2vw,26px)\">\n      <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.014em\">Lab culture answers the wrong week<\/h3>\n      <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0\">A plate count takes 24 to 72 hours, and up to 10 days for <em>Legionella<\/em>. By the time it lands, the bather load and the water are different. You get history. You need a signal.<\/p>\n    <\/div>\n    <div style=\"background:#F7FBFD;padding:clamp(20px,2vw,26px)\">\n      <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.014em\">The failure is invisible until it is public<\/h3>\n      <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0\">Closures, health department action, insurance claims and press coverage all begin with a condition nobody measured for days.<\/p>\n    <\/div>\n  <\/div>\n\n  <blockquote style=\"margin:clamp(34px,4vw,52px) 0 0;padding:0 0 0 clamp(18px,2vw,28px);border-left:3px solid #2E7D74;font-size:clamp(20px,2.4vw,27px);line-height:1.4;letter-spacing:-.012em;max-width:44ch\">Your controller tells you the disinfection ran. Spectrogy tells you what survived it.<\/blockquote>\n<\/section>\n\n<section id=\"measurement\" data-screen-label=\"Measurement\" style=\"max-width:1240px;margin:0 auto;padding:clamp(40px,5vw,64px) clamp(20px,5vw,64px) clamp(56px,7vw,96px)\">\n  <div style=\"border-top:1px solid #C9DCE8;padding-top:clamp(40px,5vw,64px)\">\n    <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#5A7B90;margin:0 0 22px\">MEASUREMENT<\/p>\n    <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(29px,4vw,46px);line-height:1.06;letter-spacing:-.026em;margin:0 0 22px;max-width:22ch\">Four optical channels. One fingerprint. Read in seconds.<\/h2>\n    <p style=\"font-size:18.5px;color:#4B6B80;margin:0 0 clamp(34px,4vw,52px);max-width:62ch\">Water flows through a measurement cell on your circulation loop. Four independent measurements run on that stream continuously, each describing a different property of what is in the water. Together they form a fingerprint of the condition of the loop.<\/p>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(26px,3.4vw,52px)\">\n      <div style=\"flex:1 1 420px;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n          <i style=\"width:12px;height:12px;border-radius:50%;background:#2E7D74;flex:none\"><\/i>\n          <span style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:#5A7B90\">01<\/span>\n          <h3 style=\"font-family:Archivo,sans-serif;margin:0;font-size:20px;font-weight:700;letter-spacing:-.014em\">Laser speckle decorrelation<\/h3>\n        <\/div>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:52ch\">Reads how particles in the stream move. Live bacteria behave differently from inert debris, and the channel separates them.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 420px;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n          <i style=\"width:12px;height:12px;border-radius:50%;background:#E9A13B;flex:none\"><\/i>\n          <span style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:#5A7B90\">02<\/span>\n          <h3 style=\"font-family:Archivo,sans-serif;margin:0;font-size:20px;font-weight:700;letter-spacing:-.014em\">Autofluorescence<\/h3>\n        <\/div>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:52ch\">Biological material glows under excitation. <em>Pseudomonas aeruginosa<\/em>, behind hot tub folliculitis and much of the biofilm burden in warm water, carries a distinct emission signature the sensor reads directly.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 420px;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n          <i style=\"width:12px;height:12px;border-radius:50%;background:#8B57C2;flex:none\"><\/i>\n          <span style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:#5A7B90\">03<\/span>\n          <h3 style=\"font-family:Archivo,sans-serif;margin:0;font-size:20px;font-weight:700;letter-spacing:-.014em\">UV absorbance<\/h3>\n        <\/div>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:52ch\">Quantifies the organic burden in the water: bather waste, byproduct precursors and dissolved compounds. That burden is what consumes your chlorine and feeds bacterial growth.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 420px;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n          <i style=\"width:12px;height:12px;border-radius:50%;background:#3F6FD1;flex:none\"><\/i>\n          <span style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:#5A7B90\">04<\/span>\n          <h3 style=\"font-family:Archivo,sans-serif;margin:0;font-size:20px;font-weight:700;letter-spacing:-.014em\">Ultrasonic transit time<\/h3>\n        <\/div>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:52ch\">Gives flow, density and temperature reference, anchoring the optical readings to real hydraulic conditions.<\/p>\n      <\/div>\n    <\/div>\n\n    <div style=\"margin-top:clamp(34px,4vw,52px);background:#F7FBFD;border:1px solid #C9DCE8;padding:clamp(24px,3vw,40px);display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px)\">\n      <h3 style=\"flex:1 1 320px;font-family:Archivo,sans-serif;margin:0;font-size:clamp(20px,2.2vw,26px);font-weight:700;letter-spacing:-.018em;line-height:1.2;max-width:24ch\">No single channel is sufficient. The answer lives in the combination.<\/h3>\n      <div style=\"flex:1.4 1 380px;min-width:0\">\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0 0 14px;max-width:56ch\">A single channel is ambiguous: a moving particle could be a bacterium or a dust grain, a fluorescence peak could be an organism or sunscreen. The discrimination lives in all four channels read together, by a trained classifier, in real time.<\/p>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:56ch\">The models run on the device, so the core measurement never depends on a network connection.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"system\" data-screen-label=\"System architecture\" style=\"background:#0B2233;border-top:1px solid #1E4864\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px);color:#EAF3F9\">\n    <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#63C7E8;margin:0 0 22px\">SYSTEM ARCHITECTURE<\/p>\n    <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(28px,3.8vw,44px);line-height:1.06;letter-spacing:-.026em;margin:0 0 clamp(34px,4vw,52px);max-width:24ch\">Installed on the loop. Reading every minute of every day.<\/h2>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:1px;background:#1E4864;border:1px solid #1E4864;margin-bottom:clamp(30px,3.5vw,44px)\">\n      <div style=\"flex:1 1 150px;min-width:0;background:#14344A;padding:18px 16px\">\n        <p style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#63C7E8;margin:0 0 8px\">STEP 1 \u00b7 SAMPLE<\/p>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#A8C6DA;margin:0\">Plumbed into the recirculation loop on a sidestream after filtration. No bottles, no cartridges, no operator handling.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 150px;min-width:0;background:#14344A;padding:18px 16px\">\n        <p style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#63C7E8;margin:0 0 8px\">STEP 2 \u00b7 MEASURE<\/p>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#A8C6DA;margin:0\">Four channels acquire simultaneously, building a continuous record of the water second by second.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 150px;min-width:0;background:#14344A;padding:18px 16px\">\n        <p style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#63C7E8;margin:0 0 8px\">STEP 3 \u00b7 CLASSIFY<\/p>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#A8C6DA;margin:0\">Onboard models compare the live fingerprint against the library and the baseline learned for your pool.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 150px;min-width:0;background:#14344A;padding:18px 16px\">\n        <p style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#63C7E8;margin:0 0 8px\">STEP 4 \u00b7 ALERT<\/p>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#A8C6DA;margin:0\">Events surface in the dashboard and push by SMS, email or straight into your building management system.<\/p>\n      <\/div>\n      <div style=\"flex:1 1 150px;min-width:0;background:#14344A;padding:18px 16px\">\n        <p style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#63C7E8;margin:0 0 8px\">STEP 5 \u00b7 ACT AND VERIFY<\/p>\n        <p style=\"font-size:15.5px;line-height:1.5;color:#A8C6DA;margin:0\">You superchlorinate, backwash or service the jets, and the sensor shows within minutes whether it worked.<\/p>\n      <\/div>\n    <\/div>\n\n    <div style=\"border:1px solid #1E4864;background:#071827;padding:clamp(18px,2.2vw,26px);display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:Archivo,sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.04em;color:#7C9FB8\">\n      <span style=\"padding:8px 14px;border:1px solid #1E4864\">POOL<\/span><span style=\"color:#2A5B7A\">\u2192<\/span>\n      <span style=\"padding:8px 14px;border:1px solid #1E4864\">FILTER<\/span><span style=\"color:#2A5B7A\">\u2192<\/span>\n      <span style=\"padding:8px 14px;border:1px solid #2E7D74;color:#EAF3F9;background:rgba(46,125,116,.18)\">SPECTROGY SENSOR ON SIDESTREAM<\/span><span style=\"color:#2A5B7A\">\u2192<\/span>\n      <span style=\"padding:8px 14px;border:1px solid #1E4864\">HEATER<\/span><span style=\"color:#2A5B7A\">\u2192<\/span>\n      <span style=\"padding:8px 14px;border:1px solid #1E4864\">CHEMICAL FEED<\/span><span style=\"color:#2A5B7A\">\u2192<\/span>\n      <span style=\"padding:8px 14px;border:1px solid #1E4864\">RETURN<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"platform\" data-screen-label=\"Fleet library\" style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px) clamp(40px,5vw,64px)\">\n  <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#5A7B90;margin:0 0 22px\">PLATFORM<\/p>\n  <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(29px,4vw,46px);line-height:1.06;letter-spacing:-.026em;margin:0 0 22px;max-width:22ch\">Every sensor in the field gets smarter on the same day.<\/h2>\n  <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,3vw,48px);margin:0\">\n    <p style=\"flex:1 1 380px;font-size:18.5px;color:#4B6B80;margin:0;max-width:54ch\">Spectrogy maintains a central detection library covering pathogens, chemical markers and process signatures across all deployments of the platform, in aquatic facilities, greenhouses, industrial cooling loops and process water systems. When a new target is validated, it is pushed to every installed instrument as a software update.<\/p>\n    <p style=\"flex:1 1 320px;font-size:18.5px;color:#0E2433;font-weight:600;margin:0;max-width:44ch\">Your installed base gains new detection capability with no hardware change, no site visit and no additional capital cost.<\/p>\n  <\/div>\n  <\/section>\n\n<section id=\"deployment\" data-screen-label=\"Deployment path\" style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,5vw,64px) clamp(40px,5vw,64px)\">\n  <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#5A7B90;margin:0 0 22px\">GETTING STARTED<\/p>\n  <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(29px,4vw,46px);line-height:1.06;letter-spacing:-.026em;margin:0 0 clamp(30px,3.6vw,44px);max-width:22ch\">From site survey to live monitoring in 5 weeks.<\/h2>\n  <div style=\"border-top:2px solid #0E2433\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,44px);padding:22px 0;border-bottom:1px solid #C9DCE8\">\n      <p style=\"flex:0 0 200px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0\">Week 1 \u00b7 Site survey<\/p>\n      <p style=\"flex:1 1 340px;font-size:16.5px;color:#4B6B80;margin:0;max-width:60ch\">We review your hydraulic schematic, circulation rates, chemical feed configuration and control panel. Output is a fixed installation plan and integration map.<\/p>\n    <\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,44px);padding:22px 0;border-bottom:1px solid #C9DCE8\">\n      <p style=\"flex:0 0 200px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0\">Week 2 \u00b7 Installation<\/p>\n      <p style=\"flex:1 1 340px;font-size:16.5px;color:#4B6B80;margin:0;max-width:60ch\">Sidestream tie in and mount, performed by your contractor or ours. Panel integration and network configuration.<\/p>\n    <\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,44px);padding:22px 0;border-bottom:1px solid #C9DCE8\">\n      <p style=\"flex:0 0 200px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0\">Weeks 3 to 4 \u00b7 Baseline capture<\/p>\n      <p style=\"flex:1 1 340px;font-size:16.5px;color:#4B6B80;margin:0;max-width:60ch\">The system learns the normal signature of your specific water: your source water, your bather pattern, your chemistry regime. Alerting thresholds are set against your baseline.<\/p>\n    <\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,44px);padding:22px 0;border-bottom:1px solid #C9DCE8\">\n      <p style=\"flex:0 0 200px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0\">Week 5 \u00b7 Go live<\/p>\n      <p style=\"flex:1 1 340px;font-size:16.5px;color:#4B6B80;margin:0;max-width:60ch\">Alerting active, operator training complete, dashboard access issued to your team.<\/p>\n    <\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,44px);padding:22px 0;border-bottom:1px solid #C9DCE8\">\n      <p style=\"flex:0 0 200px;font-family:Archivo,sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0\">Ongoing<\/p>\n      <p style=\"flex:1 1 340px;font-size:16.5px;color:#4B6B80;margin:0;max-width:60ch\">Library updates arrive automatically. Support and model tuning are included in the subscription.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"pricing\" data-screen-label=\"Commercial model\" style=\"max-width:1240px;margin:0 auto;padding:clamp(40px,5vw,64px) clamp(20px,5vw,64px)\">\n  <div style=\"border-top:1px solid #C9DCE8;padding-top:clamp(40px,5vw,64px)\">\n    <p style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2em;color:#5A7B90;margin:0 0 22px\">PRICING<\/p>\n    <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(29px,4vw,46px);line-height:1.06;letter-spacing:-.026em;margin:0 0 clamp(30px,3.6vw,44px);max-width:22ch\">Subscription per body of water. Hardware included.<\/h2>\n    <div style=\"overflow-x:auto;border:1px solid #C9DCE8;background:#F7FBFD\">\n      <div style=\"min-width:520px;display:grid;grid-template-columns:minmax(200px,1.6fr) minmax(96px,1fr) minmax(96px,1fr)\">\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:14px 16px;border-bottom:2px solid #0E2433\"><\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:#0E2433;text-align:right;padding:14px 16px;border-bottom:2px solid #0E2433\">STANDARD POOL<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:#0E2433;text-align:right;padding:14px 16px;border-bottom:2px solid #0E2433\">HIGH-RISK POOL<sup style=\"font-weight:600\">1<\/sup><\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:16px 16px 8px;border-bottom:1px solid #C9DCE8;background:#ECF2F6\">MONTHLY SUBSCRIPTION, PER POOL<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:16px 16px 8px;border-bottom:1px solid #C9DCE8;background:#ECF2F6\"><\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:16px 16px 8px;border-bottom:1px solid #C9DCE8;background:#ECF2F6\"><\/div>\n        <div style=\"font-size:15.5px;line-height:1.4;color:#4B6B80;padding:11px 16px;border-bottom:1px solid #C9DCE8\">First pool at a site<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$550<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$770<\/div>\n        <div style=\"font-size:15.5px;line-height:1.4;color:#4B6B80;padding:11px 16px;border-bottom:1px solid #C9DCE8\">Each additional pool at the same site, 25% off<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$410<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$580<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:16px 16px 8px;border-bottom:1px solid #C9DCE8;background:#ECF2F6\">ONBOARDING, ONE TIME<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:16px 16px 8px;border-bottom:1px solid #C9DCE8;background:#ECF2F6\"><\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#5A7B90;padding:16px 16px 8px;border-bottom:1px solid #C9DCE8;background:#ECF2F6\"><\/div>\n        <div style=\"font-size:15.5px;line-height:1.4;color:#4B6B80;padding:11px 16px;border-bottom:1px solid #C9DCE8\">First pool at a site<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$4,800<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$4,800<\/div>\n        <div style=\"font-size:15.5px;line-height:1.4;color:#4B6B80;padding:11px 16px;border-bottom:1px solid #C9DCE8\">Each additional pool at the same site, 50% off<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$2,400<\/div>\n        <div style=\"font-family:Archivo,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.014em;color:#0E2433;text-align:right;padding:11px 16px;border-bottom:1px solid #C9DCE8\">$2,400<\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(18px,2.4vw,32px);margin-top:clamp(22px,2.6vw,32px)\">\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:15px;font-weight:700;letter-spacing:-.01em\">Subscription includes<\/h3>\n        <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0;max-width:42ch\">The instrument, cloud dashboard, alerting, detection library updates, model tuning for your water, scheduled service and support. No reagents, no test strips, no cartridges, no per-test cost.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:15px;font-weight:700;letter-spacing:-.01em\">Onboarding includes<\/h3>\n        <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0;max-width:42ch\">Site survey, mounting kit, installation and commissioning, controller and network integration, baseline capture and staff training.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:15px;font-weight:700;letter-spacing:-.01em\">Term<\/h3>\n        <p style=\"font-size:15.5px;line-height:1.55;color:#4B6B80;margin:0;max-width:42ch\">12 months with the instrument included. Annual renewal thereafter.<\/p>\n      <\/div>\n    <\/div>\n\n    <p style=\"font-size:14.5px;line-height:1.5;color:#5A7B90;border-top:1px solid #C9DCE8;padding-top:14px;margin:clamp(20px,2.4vw,28px) 0 0;max-width:82ch\"><sup>1<\/sup> High-risk pools include elevated temperature, aeration and low water volume per bather concentrate biological risk in these bodies of water, and they generate the majority of incidents on a typical site.<\/p>\n\n  <\/div>\n<\/section>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"max-width:1240px;margin:0 auto;padding:clamp(40px,5vw,64px) clamp(20px,5vw,64px) clamp(56px,7vw,88px)\">\n  <div style=\"border-top:1px solid #C9DCE8;padding-top:clamp(40px,5vw,64px)\">\n    <h2 style=\"font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(24px,3vw,34px);line-height:1.08;letter-spacing:-.024em;margin:0 0 clamp(28px,3.4vw,40px)\">Questions we get from the panel room<\/h2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(22px,2.8vw,40px)\">\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">Does this replace my chemistry controller?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">No. The chemistry controller manages disinfection and pH. Spectrogy monitors the biological and organic condition of the water. They run on the same panel and answer different questions.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">Does it work with salt systems and UV or ozone secondary disinfection?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">Yes. The measurement is optical and independent of the disinfection method. Facilities running secondary disinfection often benefit most, because it lets them verify that the secondary system is delivering the biological result it was specified for.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">What happens if the internet connection drops?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">Measurement and classification continue on the device. Data buffers locally and syncs when the connection returns. Local alarm outputs remain active.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">How often does it need calibration?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">Drift correction runs continuously in software using learned instrument baselines. Scheduled physical service is covered by the subscription.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">Can it detect <em>Legionella<\/em>?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">Library status for specific organisms is documented in the technical dossier. General bacterial load, biofilm shedding activity and <em>Pseudomonas<\/em> signatures are core targets for aquatic deployments. Contact us for the current validated target list.<\/p>\n      <\/div>\n                  <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">Who owns the data?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">The facility owns its measurement data. Aggregated and anonymized signatures contribute to library development under the terms of the subscription agreement.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"font-family:Archivo,sans-serif;margin:0 0 6px;font-size:17.5px;font-weight:700;letter-spacing:-.012em\">Is this suitable for retrofit?<\/h3>\n        <p style=\"font-size:16.5px;color:#4B6B80;margin:0;max-width:48ch\">Yes. Most installations are retrofits onto existing circulation loops. New build projects gain a cleaner integration path and lower installation cost.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\"><\/script>\n\n<\/body><\/html>"</script>
